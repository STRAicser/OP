<script id="js_contact">
  function contact(act) {
		let main=d.getElementById("f_contact");
		let T_label=main.getElementsByTagName("h2");
		let T_input=main.getElementsByTagName("input");
		if(act=="c") {
			T_label[2].style.display="none";
			T_input[2].style.display="none";
			T_input[2].required=false;
			T_label[3].style.display="none";
			T_input[3].style.display="none";
			T_input[3].required=false;
			T_input[4].required=true;
		} else {
			T_input[0].value="p";
			T_label[2].removeAttribute("style");
			T_input[2].removeAttribute("style");
			T_input[2].required=true;
			T_label[3].removeAttribute("style");
			T_input[3].removeAttribute("style");
			T_input[3].required=true;
			T_input[4].required=true;
		}
		d.getElementById("f_contact").style.display="block";
	}

<script id="js_myDate">
  function myDate(k) {
		let dt=new Date();
		let y = dt.getFullYear();
		let m = dt.getMonth()+1;
		let day=dt.getDate();
		let hour = dt.getHours();
		let mn = dt.getMinutes();
		if(k==0) {
			dt=y+"-"+m+"-"+day+" T "+hour+":"+mn;
		}else if(k=="y"){
			dt=y;
		} else if(k=="m") {
			dt=m;
		} else if(k=="d") {
			dt=day;
		} else if(k=="h") {
			dt=hour;
		} else if(k=="mn") {
			dt=mn;
		} else if(k=="y") {
			dt=y;
		}
		return dt;
	};
</script>

<script id="js_slides">
function slides(el,n,a) {
	let slides=d.querySelectorAll("#"+el+"_P> section");
	if((n+a)<0){
		n=0;
	}else if((n+a)>slides.length-1){
		n=slides.length-1;
	}else{
		n=n+a;
	}


	let slide_nav=d.querySelectorAll("#slide_nav > button");
  	slide_nav[0].setAttribute("onclick","slides('"+el+"',"+n+",-1)");
  	slide_nav[1].setAttribute("onclick","slides('"+el+"',"+n+",1)");
	for(let i=0;i<slides.length;i++) {slides[i].style.display="none";}
	slides[n].style.display="block";
}
</script>
<script id="js_include_HTML">
  function includeHTML() {
	//<div w3-include-html="content.html"></div>
	//includeHTML();

	var z, i, elmnt, file, xhttp;
/*loop through a collection of all HTML elements:*/
	z = document.getElementsByTagName("*");
	for(i = 0; i < z.length; i++) {
		elmnt = z[i];
/*search for elements with a certain attribute:*/
		file = elmnt.getAttribute("w3-include-html");
		if(file) {
/*make an HTTP request using the attribute value as the file name:*/
			xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if(this.readyState == 4) {
					if(this.status == 200) {
						elmnt.innerHTML = this.responseText;}
					if(this.status == 404) {
						elmnt.innerHTML = "Page not found.";}
/*remove the attribute, and call this function once more:*/
					elmnt.removeAttribute("w3-include-html");
					includeHTML();
				}
			}
			xhttp.open("GET", file, true);
			xhttp.send();
/*exit the function:*/
			return;
		}
	}
};
</script>
